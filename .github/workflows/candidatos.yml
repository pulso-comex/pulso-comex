name: Buscar fotos candidatas (temporal)
on:
  push:
    branches: [fotos-candidatas]
    paths: ['search.py']
permissions:
  contents: write
jobs:
  search:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - run: python -m pip install --quiet pillow
      - run: python search.py
        timeout-minutes: 15
      - run: |
          git config user.name 'Pulso Comex Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A download-report.txt sheet-final.jpg
          git commit -m "candidatos" && git push
